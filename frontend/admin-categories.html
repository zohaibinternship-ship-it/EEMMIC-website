<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Enquiry Categories | EEMMIC Admin</title>
<meta name="description" content="Manage the categories clients pick from when applying for an EEMMIC framework.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23101014%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 font-family=%22Arial%22 fill=%22%23FFD400%22 text-anchor=%22middle%22>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body data-require-role="admin" data-page-title="Enquiry Categories" data-page-subtitle="What clients pick from when applying for a framework.">

<div class="page-loader" id="pageLoader"><div class="loader-mark">E</div></div>

<div id="portalApp" style="display:none;">
  <aside id="portalSidebar"></aside>
  <div class="portal-content-col">
    <header id="portalHeader"></header>
    <main id="mainContent">

      <div class="form-card reveal" style="max-width:640px; margin-bottom:32px;">
        <div class="form-card__head">
          <div class="form-card__eyebrow">New category</div>
          <h2 style="font-size:1.2rem; margin-bottom:8px;">Add a category.</h2>
        </div>
        <form id="categoryForm">
          <div class="form-row">
            <div class="field"><label for="catFormType">Framework</label>
              <select id="catFormType">
                <option value="evaluation">Evaluation</option>
                <option value="management">Management</option>
                <option value="marketplace">Marketplace</option>
                <option value="investment">Investment</option>
              </select>
            </div>
            <div class="field"><label for="catName">Name</label><input type="text" id="catName" required></div>
          </div>
          <div class="field"><label for="catDescription">Description</label><input type="text" id="catDescription"></div>
          <p class="form-error" id="categoryError" style="display:none;"></p>
          <button type="submit" class="btn btn-primary" style="width:100%;">Add Category</button>
        </form>
      </div>

      <div class="portal-table-wrap">
        <table class="portal-table" id="categoriesTable">
          <thead>
            <tr><th>Name</th><th>Framework</th><th>Status</th><th>Created</th><th style="min-width:160px;">Actions</th></tr>
          </thead>
          <tbody id="categoriesBody">
            <tr><td colspan="5" class="portal-empty">Loading categories…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/portal-nav-data.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/main.js"></script>
<script src="js/admin-categories.js"></script>
</body>
</html>
