<body>

  <div class="container navbar-inner">
    <a href="index.html" class="logo"><span class="logo-mark">E</span><span class="logo-text">EEMMIC</span></a>

      <a href="about.html" class="nav-link">About</a>
      <a href="solutions.html" class="nav-link">Solutions</a>
      <div class="nav-item has-dropdown">
        <a href="projects.html" class="nav-link">EMMIC</a>
        <button class="dropdown-caret-btn" aria-label="Toggle EMMIC menu" aria-expanded="false"><svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="dropdown-menu">

    </div>

</header>

<main>

  <section class="auth-shell">
    <div class="container">
      <div class="form-card reveal">
        <div class="form-card__head">
          <div class="form-card__eyebrow">Account</div>
          <h1 style="font-size:1.7rem; margin-bottom:8px;">Welcome back.</h1>
          <p style="color:var(--color-text-muted); font-size:0.94rem;">Buyers, suppliers, investors, and admins all log in here.</p>
        </div>
        <form id="loginForm">
          <div class="field"><label for="email">Email Address</label><input type="email" id="email" required></div>
          <div class="field"><label for="password">Password</label><input type="password" id="password" required minlength="6"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Log In
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </form>
        <p style="margin-top:20px; font-size:0.9rem; color:var(--color-text-muted); text-align:center;">Don't have an account? <a href="signup.html" style="color:var(--color-secondary); font-weight:600;">Sign up</a></p>
      </div>
    </div>
  </section>

</main>
